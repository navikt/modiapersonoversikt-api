query hentTredjepartspersondata($identer: [ID!]!){
    hentPersonBolk(identer: $identer) {
        ident
        person {
            navn(historikk: false) {
                fornavn
                mellomnavn
                etternavn
                metadata {
                    master
                }
            }
            kjoenn(historikk: false) {
                kjoenn
            }
            foedselsdato {
                foedselsdato
            }
            foedested {
                foedeland
                foedested
                foedekommune
            }
            doedsfall {
                doedsdato
            }
            adressebeskyttelse(historikk: false) {
                gradering
            }
            bostedsadresse(historikk: false) {
                folkeregistermetadata {
                    ajourholdstidspunkt
                    kilde
                }
                vegadresse {
                    husnummer
                    husbokstav
                    bruksenhetsnummer
                    adressenavn
                    kommunenummer
                    bydelsnummer
                    tilleggsnavn
                    postnummer
                }
                matrikkeladresse {
                    bruksenhetsnummer
                    tilleggsnavn
                    postnummer
                    kommunenummer
                }
                utenlandskAdresse {
                    adressenavnNummer
                    bygningEtasjeLeilighet
                    postboksNummerNavn
                    postkode
                    bySted
                    regionDistriktOmraade
                    landkode
                }
                ukjentBosted {
                    bostedskommune
                }
            }
        }
    }
}
