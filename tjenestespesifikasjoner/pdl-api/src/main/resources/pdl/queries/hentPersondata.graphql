fragment vegadresse on Vegadresse {
    matrikkelId
    husnummer
    husbokstav
    bruksenhetsnummer
    adressenavn
    kommunenummer
    bydelsnummer
    tilleggsnavn
    postnummer
}
fragment matrikkeladresse on Matrikkeladresse {
    matrikkelId
    bruksenhetsnummer
    tilleggsnavn
    postnummer
    kommunenummer
}
fragment utenlandskadresse on UtenlandskAdresse {
    adressenavnNummer
    bygningEtasjeLeilighet
    postboksNummerNavn
    postkode
    bySted
    regionDistriktOmraade
    landkode
}
fragment utenlandskadresseIFrittFormat on UtenlandskAdresseIFrittFormat {
    adresselinje1
    adresselinje2
    adresselinje3
    postkode
    byEllerStedsnavn
    landkode
}
fragment postadresseIFrittFormat on PostadresseIFrittFormat {
    adresselinje1
    adresselinje2
    adresselinje3
    postnummer
}
fragment postboksadresse on Postboksadresse {
    postbokseier
    postboks
    postnummer
}

fragment endringerOgMaster on Metadata {
    master
    endringer {
        registrert
        registrertAv
        systemkilde
        kilde
    }
}

fragment biPerson on RelatertBiPerson {
    navn {
        fornavn
        mellomnavn
        etternavn
    }
    foedselsdato
    statsborgerskap
    kjoenn
}

query hentPersondata($ident: ID!){
    hentGeografiskTilknytning(ident: $ident) {
        gtType
        gtKommune
        gtBydel
        gtLand
    }
    hentPerson(ident: $ident) {
        navn(historikk: false) {
            fornavn
            mellomnavn
            etternavn
            metadata {
                ...endringerOgMaster
            }
        }
        kjoenn(historikk: false) {
            kjoenn
        }
        foedselsdato {
            foedselsdato
        }
        foedested {
            foedeland
            foedested
            foedekommune
        }
        adressebeskyttelse(historikk: false) {
            gradering
        }
        statsborgerskap(historikk: false) {
            land,
            gyldigFraOgMed,
            gyldigTilOgMed
        }
        opphold(historikk: false) {
            type
            oppholdFra
            oppholdTil
        }
        doedsfall {
            doedsdato,
            metadata {
              ...endringerOgMaster
            }
        }
        folkeregisterpersonstatus(historikk: false) {
            status
        }
        sivilstand(historikk: false) {
            type
            gyldigFraOgMed
            relatertVedSivilstand
        }
        sikkerhetstiltak {
            tiltakstype
            beskrivelse
            gyldigFraOgMed
            gyldigTilOgMed
        }
        kontaktinformasjonForDoedsbo(historikk: false) {
            skifteform
            attestutstedelsesdato
            personSomKontakt {
                foedselsdato
                personnavn {
                    fornavn
                    mellomnavn
                    etternavn
                }
                identifikasjonsnummer
            }
            advokatSomKontakt {
                personnavn {
                    fornavn
                    mellomnavn
                    etternavn
                }
                organisasjonsnavn
                organisasjonsnummer
            }
            organisasjonSomKontakt {
                organisasjonsnavn
                organisasjonsnummer
                kontaktperson {
                    fornavn
                    mellomnavn
                    etternavn
                }
            }
            adresse {
                adresselinje1
                adresselinje2
                poststedsnavn
                postnummer
                landkode
            }
            metadata {
                ...endringerOgMaster
            }
        }
        tilrettelagtKommunikasjon {
            talespraaktolk {
                spraak
            }
            tegnspraaktolk {
                spraak
            }
        }
        telefonnummer(historikk: false) {
            landskode
            nummer
            prioritet
            metadata {
                ...endringerOgMaster
            }
        }
        vergemaalEllerFremtidsfullmakt(historikk: true) {
            type
            embete
            metadata {
                historisk
            }
            vergeEllerFullmektig {
                identifiserendeInformasjon {
                    navn  {
                        fornavn
                        mellomnavn
                        etternavn
                    }
                    kjoenn
                    foedselsdato
                    statsborgerskap
                }
                motpartsPersonident
                omfang
                omfangetErInnenPersonligOmraade
                tjenesteomraade {
                    tjenestevirksomhet
                    tjenesteoppgave
                }
            }
            folkeregistermetadata {
                gyldighetstidspunkt
                opphoerstidspunkt
            }
        }
        rettsligHandleevne(historikk: false) {
            rettsligHandleevneomfang
            folkeregistermetadata {
                gyldighetstidspunkt
                opphoerstidspunkt
            }
        }
        foreldreansvar(historikk: false) {
            ansvar
            ansvarlig
            ansvarssubjekt
            metadata {
                historisk
            }
            ansvarligUtenIdentifikator {
                ...biPerson
            }
        }
        forelderBarnRelasjon {
            relatertPersonsIdent
            relatertPersonUtenFolkeregisteridentifikator {
                ...biPerson
            }
            relatertPersonsRolle
        }
        deltBosted(historikk: false) {
            startdatoForKontrakt
            sluttdatoForKontrakt
            coAdressenavn
            vegadresse {
                ...vegadresse
            }
            matrikkeladresse {
                ...matrikkeladresse
            }
            utenlandskAdresse {
                ...utenlandskadresse
            }
            ukjentBosted{
                bostedskommune
            }
        }
        bostedsadresse(historikk: true) {
            angittFlyttedato
            gyldigFraOgMed
            gyldigTilOgMed
            metadata {
                ...endringerOgMaster
                historisk
            }
            folkeregistermetadata {
                ajourholdstidspunkt
                kilde
            }
            vegadresse {
                ...vegadresse
            }
            matrikkeladresse {
                ...matrikkeladresse
            }
            utenlandskAdresse {
                ...utenlandskadresse
            }
            ukjentBosted {
                bostedskommune
            }
        }
        kontaktadresse(historikk: false) {
            gyldigFraOgMed
            gyldigTilOgMed
            metadata {
               ...endringerOgMaster
            }
            coAdressenavn
            postadresseIFrittFormat {
                ...postadresseIFrittFormat
            }
            postboksadresse {
                ...postboksadresse
            }
            vegadresse {
                ...vegadresse
            }
            utenlandskAdresse {
                ...utenlandskadresse
            }
            utenlandskAdresseIFrittFormat {
                ...utenlandskadresseIFrittFormat
            }
        }
        oppholdsadresse(historikk: false) {
            gyldigFraOgMed
            gyldigTilOgMed
            oppholdAnnetSted
            coAdressenavn
            vegadresse {
                ...vegadresse
            }
            matrikkeladresse {
                ...matrikkeladresse
            }
            utenlandskAdresse {
                ...utenlandskadresse
            }
            metadata {
                ...endringerOgMaster
            }
        }
        innflyttingTilNorge {
            fraflyttingsland
            folkeregistermetadata {
                gyldighetstidspunkt
                opphoerstidspunkt
            }
            metadata {
                ...endringerOgMaster
            }
        }
        utflyttingFraNorge {
            tilflyttingsland
            utflyttingsdato
            folkeregistermetadata {
                gyldighetstidspunkt
                opphoerstidspunkt
            }
            metadata {
                ...endringerOgMaster
            }
        }
    }
}
